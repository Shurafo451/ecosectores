<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>EcoSectores</title>
  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="46" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4"/>
  <!-- Engranaje: representa la industria y los sectores productivos -->
  <g fill="#37474f" transform="translate(50 68)">
    <rect x="-4" y="-25" width="8" height="10" rx="1"/>
    <rect x="-4" y="-25" width="8" height="10" rx="1" transform="rotate(45)"/>
    <rect x="-4" y="-25" width="8" height="10" rx="1" transform="rotate(90)"/>
    <rect x="-4" y="-25" width="8" height="10" rx="1" transform="rotate(135)"/>
    <rect x="-4" y="-25" width="8" height="10" rx="1" transform="rotate(180)"/>
    <rect x="-4" y="-25" width="8" height="10" rx="1" transform="rotate(225)"/>
    <rect x="-4" y="-25" width="8" height="10" rx="1" transform="rotate(270)"/>
    <rect x="-4" y="-25" width="8" height="10" rx="1" transform="rotate(315)"/>
    <circle r="18"/>
    <circle r="7" fill="#e8f5e9"/>
  </g>
  <!-- Hoja: representa la sostenibilidad -->
  <path d="M50 62 C 28 52, 30 24, 66 12 C 74 34, 68 54, 50 62 Z" fill="#43a047"/>
  <path d="M50 62 C 54 46, 58 30, 66 12" fill="none" stroke="#e8f5e9" stroke-width="2.5" stroke-linecap="round"/>
</svg>
