<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <title>Aerogenerador girando</title>
  <!-- Cielo y suelo -->
  <rect width="300" height="300" fill="#e3f2fd"/>
  <rect y="250" width="300" height="50" fill="#81c784"/>
  <!-- Nube que se desplaza -->
  <g fill="#ffffff">
    <ellipse cx="0" cy="50" rx="30" ry="12"/>
    <ellipse cx="22" cy="42" rx="20" ry="12"/>
    <animateTransform attributeName="transform" type="translate" from="-60 0" to="360 0" dur="14s" repeatCount="indefinite"/>
  </g>
  <!-- Torre -->
  <polygon points="146,100 154,100 160,255 140,255" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <!-- Palas: giran alrededor del buje (150, 100) -->
  <g fill="#ffffff" stroke="#90a4ae" stroke-width="1.5">
    <path d="M150 100 L144 40 Q150 22 156 40 Z"/>
    <path d="M150 100 L144 40 Q150 22 156 40 Z" transform="rotate(120 150 100)"/>
    <path d="M150 100 L144 40 Q150 22 156 40 Z" transform="rotate(240 150 100)"/>
    <animateTransform attributeName="transform" type="rotate" from="0 150 100" to="360 150 100" dur="3s" repeatCount="indefinite"/>
  </g>
  <!-- Buje -->
  <circle cx="150" cy="100" r="7" fill="#607d8b"/>
</svg>
